function renderChapters(key){let list=chapters[key]||[];shell(`<div class="odl-choice-head"><h1>${esc(key.replace(/-/g,' '))}</h1><p>Choisissez un chapitre.</p></div><div class="odl-chapter-list">${list.map((c,i)=>`<article class="odl-chapter"><span class="odl-num">${String(i+1).padStart(2,'0')}</span><h2>${esc(c.title)}</h2><div class="odl-resource-links"><a onclick="go('${c.base}-Cours')"><span class="odl-folder"></span>Cours</a><a onclick="go('${c.base}-Exercices')"><span class="odl-folder"></span>Exercices</a></div></article>`).join('')}</div>`)}
const exerciceRoutes={
'TCS':[{name:'Sciences',label:'TCS-Sciences-Exercices-Corriges'},{name:'Lettres',label:'TCS-Lettres-Exercices-Corriges'}],
'1BAC':[{name:'Sciences',label:'1BAC-Sciences-Exercices-Corriges'},{name:'SMA',label:'1BAC-SMA-Exercices-Corriges'},{name:'Lettres',label:'1BAC-Lettres-Exercices-Corriges'}],
'2BAC':[{name:'PC & SVT',label:'2BAC-PC-SVT-Exercices-Corriges'},{name:'SMA',label:'2BAC-SMA-Exercices-Corriges'},{name:'Lettres',label:'2BAC-Lettres-Exercices-Corriges'}]};
const devoirRoutes={
'TCS':[{name:'Sciences',key:'TCS-Sciences'},{name:'Lettres',key:'TCS-Lettres'}],
'1BAC':[{name:'Sciences',key:'1BAC-Sciences'},{name:'SMA',key:'1BAC-SMA'},{name:'Lettres',key:'1BAC-Lettres'}],
'2BAC':[{name:'PC & SVT',key:'2BAC-PC-SVT'},{name:'SMA',key:'2BAC-SMA'},{name:'Lettres',key:'2BAC-Lettres'}]};
const devoirsConfig={'TCS-Sciences':{S1:[4,4,4,4],S2:[4,4,4,4]},'TCS-Lettres':{S1:[4,4,4,4],S2:[4,4,4,4]},'1BAC-Sciences':{S1:[4,4,4,4],S2:[4,4,4,4]},'1BAC-SMA':{S1:[4,4,4,4],S2:[4,4,4,4]},'1BAC-Lettres':{S1:[4,4,4,4],S2:[4,4,4,4]},'2BAC-PC-SVT':{S1:[4,4,4,4],S2:[4,4,4,4]},'2BAC-SMA':{S1:[4,4,4,4],S2:[4,4,4,4]},'2BAC-Lettres':{S1:[4,4,4,4],S2:[4,4,4,4]}};
function route(label,push=true){
closeMenu(); if(push) history.pushState({route:label},'', '?odl='+encodeURIComponent(label));
if(label==='Cours'){shell(`<div class="odl-choice-head"><h1>Cours</h1><p>Choisissez votre niveau.</p></div><div class="odl-branches three">${['TCS','1BAC','2BAC'].map(x=>branchCard('COURS',x,x)).join('')}</div>`);return}
if(branches[label]){renderBranches(label);return}
if(chapters[label]){renderChapters(label);return}
if(label==='Exercices corrigés'){shell(`<div class="odl-choice-head"><h1>Exercices corrigés</h1><p>Choisissez votre niveau.</p></div><div class="odl-branches three">${['TCS','1BAC','2BAC'].map(x=>branchCard('EXERCICES CORRIGÉS',x,'EX-'+x)).join('')}</div>`);return}
if(label.startsWith('EX-')){let lvl=label.slice(3),xs=exerciceRoutes[lvl]||[];shell(`<div class="odl-choice-head"><h1>Exercices corrigés • ${lvl}</h1><p>Choisissez votre filière.</p></div><div class="odl-branches ${xs.length===3?'three':''}">${xs.map(b=>branchCard('EXERCICES CORRIGÉS',esc(b.name),b.label)).join('')}</div>`);return}
if(label==='Devoirs'){shell(`<div class="odl-choice-head"><h1>Devoirs</h1><p>Choisissez votre niveau.</p></div><div class="odl-branches three">${['TCS','1BAC','2BAC'].map(x=>branchCard('DEVOIRS',x,'DEV-'+x)).join('')}</div>`);return}
if(label.startsWith('DEV-')){let lvl=label.slice(4),ds=devoirRoutes[lvl]||[];shell(`<div class="odl-choice-head"><h1>Devoirs • ${lvl}</h1><p>Choisissez votre filière.</p></div><div class="odl-branches ${ds.length===3?'three':''}">${ds.map(b=>branchCard('DEVOIRS',esc(b.name),'Devoirs-'+b.key)).join('')}</div>`);return}
let dm=label.match(/^Devoirs-(TCS|1BAC|2BAC)-(.+)$/);
if(dm&&!/-S[12]$/.test(label)){let base=label.slice(8),pretty=base.replace(/-/g,' ').replace('PC SVT','PC & SVT');shell(`<div class="odl-choice-head"><h1>Devoirs • ${esc(pretty)}</h1><p>Choisissez le semestre.</p></div><div class="odl-branches">${branchCard('SEMESTRE','Semestre 1','Devoirs-'+base+'-S1')}${branchCard('SEMESTRE','Semestre 2','Devoirs-'+base+'-S2')}</div>`);return}
let sm=label.match(/^Devoirs-(.+)-S([12])$/);
if(sm){let base=sm[1],sem=sm[2],counts=(devoirsConfig[base]||{})['S'+sem]||[4,4,4,4];shell(`<div class="odl-choice-head"><h1>${esc(base.replace(/-/g,' '))} • Semestre ${sem}</h1><p>Les exemples sont affichés sous chaque devoir.</p></div><div class="odl-chapter-list">${counts.map((n,i)=>{let dn=String(i+1).padStart(2,'0');return `<article class="odl-chapter"><span class="odl-num">${dn}</span><h2>Devoir ${dn}</h2><div class="odl-resource-links">${Array.from({length:n},(_,j)=>{let en=String(j+1).padStart(2,'0');return `<a onclick="go('${base}-S${sem}-Devoir-${dn}-Exemple-${en}')"><span class="odl-folder"></span>Exemple ${en}</a>`}).join('')}</div></article>`}).join('')}</div>`);return}
if(label==='Examens'){shell(`<div class="odl-choice-head"><h1>Examens</h1><p>Choisissez le type d’examen.</p></div><div class="odl-branches">${branchCard('EXAMENS','Examens régionaux','Examens-Regionaux')}${branchCard('EXAMENS','Examens nationaux','Examens-Nationaux')}</div>`);return}
if(label==='Examens-Regionaux'){shell(`<div class="odl-choice-head"><h1>Examens régionaux</h1></div><div class="odl-branches">${branchCard('RÉGIONAL','1BAC','Examens-Regionaux-1BAC')}</div>`);return}
if(label==='Examens-Regionaux-1BAC'){shell(`<div class="odl-choice-head"><h1>1BAC • Examens régionaux</h1></div><div class="odl-branches">${branchCard('1BAC','Lettres','Examens-Regionaux-1BAC-Lettres')}</div>`);return}
if(label==='Examens-Nationaux'){shell(`<div class="odl-choice-head"><h1>Examens nationaux</h1></div><div class="odl-branches">${branchCard('NATIONAL','2BAC','Examens-Nationaux-2BAC')}</div>`);return}
if(label==='Examens-Nationaux-2BAC'){shell(`<div class="odl-choice-head"><h1>2BAC • Examens nationaux</h1></div><div class="odl-branches">${branchCard('2BAC','PC / SVT','Examens-Nationaux-2BAC-PC-SVT')}${branchCard('2BAC','SMA','Examens-Nationaux-2BAC-SMA')}</div>`);return}
if(['Examens-Regionaux-1BAC-Lettres','Examens-Nationaux-2BAC-PC-SVT','Examens-Nationaux-2BAC-SMA'].includes(label)){let years=[];for(let y=2004;y<=2025;y++)years.push(`${y}-${y+1}`);shell(`<div class="odl-choice-head"><h1>${esc(label.replace(/-/g,' '))}</h1><p>Choisissez un sujet ou son corrigé.</p></div><div class="odl-chapter-list">${years.map((y,i)=>`<article class="odl-chapter"><span class="odl-num">${String(i+1).padStart(2,'0')}</span><h2>${y.replace('-',' / ')}</h2><div class="odl-resource-links"><a onclick="go('${label}-${y}-Sujet')"><span class="odl-folder"></span>Sujet</a><a onclick="go('${label}-${y}-Corrige')"><span class="odl-folder"></span>Corrigé</a></div></article>`).join('')}</div>`);return}
loadFeed(label);
}
function loadFeed(label){
shell(`<div id="feed"><div class="odl-choice-head"><h1>${esc(label.replace(/-/g,' '))}</h1><p>Chargement depuis Blogger…</p></div></div>`);
window.__feedLabel=label;document.getElementById('blogger-feed')?.remove();let s=document.createElement('script');s.id='blogger-feed';s.src= BLOG+'/feeds/posts/default/-/'+encodeURIComponent(label)+'?alt=json-in-script&max-results=50&callback=renderFeed';s.onerror=()=>document.getElementById('feed').innerHTML='<p>Impossible de charger les articles.</p>';document.body.appendChild(s)
}
function renderFeed(data){
let box=document.getElementById('feed'),entries=data?.feed?.entry||[];let h=`<div class="odl-choice-head"><h1>${esc(__feedLabel.replace(/-/g,' '))}</h1></div>`;if(!entries.length){box.innerHTML=h+'<p>Aucun article trouvé dans cette catégorie.</p>';return}
entries.forEach((e,i)=>{let title=e.title?.$t||'Article',body=e.content?.$t||e.summary?.$t||'',sn=body.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,260);let date=e.published?.$t?new Date(e.published.$t).toLocaleDateString('fr-FR'):'';h+=`<article class="odl-post-card"><h2>${esc(title)}</h2><div class="odl-meta">${esc(date)}</div><div class="odl-snippet">${esc(sn)}…</div><a class="odl-read" onclick="openArticle(${i})">Lire l’article →</a></article>`});box.innerHTML=h;window.__entries=entries
}
function openArticle(i){let e=window.__entries?.[i];if(!e)return;let title=e.title?.$t||'Article',body=e.content?.$t||e.summary?.$t||'';history.pushState({article:true},'', '?article='+i);shell(`<div class="odl-choice-head"><h1>${esc(title)}</h1></div><div class="odl-full-body">${body}</div>`);if(window.MathJax?.typesetPromise) MathJax.typesetPromise()}
window.addEventListener('popstate',()=>{let p=new URLSearchParams(location.search),r=p.get('odl');if(r)route(r,false);else home()});
(function init(){let p=new URLSearchParams(location.search),r=p.get('odl');if(r)route(r,false);else home()})();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
